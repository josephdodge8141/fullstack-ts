name: fullstack-ts-local

x-preview:
  version: 1
  router: caddy
  frontend: frontend
  backend: backend
  task:
    cpu: 1024
    memoryMiB: 2048
  localOnlyMounts:
    caddy:
      - /etc/caddy/Caddyfile

services:
  caddy:
    image: caddy:2.10-alpine
    environment:
      SITE_ADDRESS: http://app.localhost:8088
      BACKEND_UPSTREAM: backend:3000
      FRONTEND_UPSTREAM: frontend:4173
    ports:
      - '8088:8088'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - backend
      - frontend
    networks:
      default:
        aliases:
          - app.localhost

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      HOST: 0.0.0.0
      PORT: 3000

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
