name: fullstack-ts-local

services:
  caddy:
    image: caddy:2.10-alpine
    ports:
      - '8088:8088'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - backend
      - frontend
      - keycloak
    networks:
      default:
        aliases:
          - app.localhost

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-local-keycloak-database-password}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U keycloak -d keycloak']
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - keycloak-postgres:/var/lib/postgresql/data

  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    command: start-dev --import-realm --http-port=8080
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-local-keycloak-database-password}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-local-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-local-admin-password}
      KC_HOSTNAME: http://app.localhost:8088
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: 'true'
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      PUBLIC_ORIGIN: http://app.localhost:8088
      OIDC_ISSUER: http://app.localhost:8088/realms/local
      OIDC_CLIENT_ID: local-web
      SESSION_SECRET: ${SESSION_SECRET:-local-development-session-secret-change-before-production}
    depends_on:
      - keycloak

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile

volumes:
  keycloak-postgres:
